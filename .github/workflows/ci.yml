name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Install the CDK CLI
        run: npm install -g aws-cdk@2.1148.1

      - name: Synthesize
        # No AWS credentials. The app supplies a placeholder account.
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: cdk synth --strict
